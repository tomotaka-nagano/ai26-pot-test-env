[project]
name = "ai26-pot-test-env"
version = "0.1.0"
description = "Simulation and test execution environment for the AI26 electric pot controller"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pdfplumber>=0.11.9",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pybind11>=2.12.0",
    "pydantic>=2.0",
    "mcp>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server", "sim", "web"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
